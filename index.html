<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тетрис</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111827;color:#f9fafb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.wrap{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center}.game{position:relative}
canvas{display:block;background:#0b1020;border:3px solid #374151;border-radius:8px;width:min(70vw,300px);height:auto;image-rendering:pixelated}
.side{width:190px;background:#1f2937;border-radius:12px;padding:16px}.side h1{margin:0 0 12px;font-size:28px}.stat{display:flex;justify-content:space-between;padding:6px 0;color:#d1d5db}.stat b{color:white}.next{margin:10px 0 14px;background:#111827;border-radius:8px;padding:8px;text-align:center}.next canvas{width:120px;height:120px;border:0;margin:auto}.help{font-size:13px;line-height:1.55;color:#cbd5e1}.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#f9fafb;color:#111827;font-weight:700;cursor:pointer}.status{margin-top:10px;text-align:center;font-weight:700;min-height:22px}
@media(max-width:600px){body{padding:10px}.wrap{gap:12px}.side{width:min(90vw,300px)}canvas{width:min(88vw,300px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="game"><canvas id="board" width="300" height="600"></canvas></div>
  <aside class="side">
    <h1>Тетрис</h1>
    <div class="stat"><span>Счёт</span><b id="score">0</b></div>
    <div class="stat"><span>Линии</span><b id="lines">0</b></div>
    <div class="stat"><span>Уровень</span><b id="level">1</b></div>
    <div class="next"><div>Следующая</div><canvas id="next" width="120" height="120"></canvas></div>
    <div class="help">← → — движение<br>↑ — поворот<br>↓ — ускорение<br>Space — сброс<br>P — пауза</div>
    <button class="btn" id="restart">Новая игра</button>
    <div class="status" id="status"></div>
  </aside>
</div>
<script>
const COLS=10,ROWS=20,S=30;
const colors=['','#60a5fa','#facc15','#c084fc','#4ade80','#f87171','#22d3ee','#fb923c'];
const shapes=[
 [[1,1,1,1]],
 [[2,2],[2,2]],
 [[0,3,0],[3,3,3]],
 [[4,0,0],[4,4,4]],
 [[0,0,5],[5,5,5]],
 [[6,6,0],[0,6,6]],
 [[7,0,0],[7,7,7]]
];
const board=document.getElementById('board'),ctx=board.getContext('2d');
const nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
let grid,piece,next,score,lines,level,dropTimer,last=0,paused=false,over=false;

function newGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}
function randomPiece(){const m=shapes[Math.floor(Math.random()*shapes.length)].map(r=>r.slice());return {m,x:Math.floor((COLS-m[0].length)/2),y:0}}
function collide(p,dx=0,dy=0,m=p.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]&&(p.y+y+dy>=ROWS||p.x+x+dx<0||p.x+x+dx>=COLS||grid[p.y+y+dy]?.[p.x+x+dx]))return true;return false}
function merge(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)grid[piece.y+y][piece.x+x]=v}))}
function rotate(){const m=piece.m;const r=m[0].map((_,i)=>m.map(row=>row[i]).reverse());const old=piece.m;piece.m=r;if(collide(piece))piece.x--;if(collide(piece))piece.x+=2;if(collide(piece))piece.x--;if(collide(piece))piece.m=old}
function clearLines(){let n=0;grid=grid.filter(r=>{if(r.every(Boolean)){n++;return false}return true});while(grid.length<ROWS)grid.unshift(Array(COLS).fill(0));if(n){lines+=n;score += [0,100,300,500,800][n]*level;level=1+Math.floor(lines/10);}}
function spawn(){piece=next;next=randomPiece();piece.x=Math.floor((COLS-piece.m[0].length)/2);piece.y=0;if(collide(piece)){over=true;document.getElementById('status').textContent='GAME OVER'}}
function lock(){merge();clearLines();spawn();update()}
function drop(){if(paused||over)return;if(!collide(piece,0,1)){piece.y++;score++}else lock();update()}
function hardDrop(){if(paused||over)return;let d=0;while(!collide(piece,0,1)){piece.y++;d++}score+=d*2;lock()}
function drawCell(c,x,y,size=S){ctx.fillStyle=colors[c];ctx.fillRect(x*size,y*size,size-1,size-1)}
function draw(){ctx.clearRect(0,0,300,600);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x])drawCell(grid[y][x],x,y);piece.m.forEach((r,y)=>r.forEach((v,x)=>v&&drawCell(v,piece.x+x,piece.y+y)));nctx.clearRect(0,0,120,120);const sz=24;const ox=(5-piece.m[0].length)/2,oy=(5-piece.m.length)/2;next.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=colors[v];nctx.fillRect((ox+x)*sz,(oy+y)*sz,sz-1,sz-1)}}))}
function update(){document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;document.getElementById('level').textContent=level;draw()}
function loop(t=0){if(!last)last=t;const speed=Math.max(90,700-(level-1)*55);if(!paused&&!over&&t-last>speed){drop();last=t}requestAnimationFrame(loop)}
function reset(){grid=newGrid();score=0;lines=0;level=1;paused=false;over=false;document.getElementById('status').textContent='';next=randomPiece();spawn();update()}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'&&!collide(piece,-1,0)&&!paused&&!over)piece.x--;if(e.key==='ArrowRight'&&!collide(piece,1,0)&&!paused&&!over)piece.x++;if(e.key==='ArrowDown')drop();if(e.key==='ArrowUp'&&!paused&&!over)rotate();if(e.key===' ')hardDrop();if(e.key.toLowerCase()==='p'&&!over){paused=!paused;document.getElementById('status').textContent=paused?'ПАУЗА':''}update()});
document.getElementById('restart').onclick=reset;reset();requestAnimationFrame(loop);
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede8e0">
  <title>Speech Image Voice — мини-апп</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" data-action="back" aria-label="Назад">‹</button>
      <strong class="brand">Speech Image</strong>
      <button class="icon-btn" data-action="menu" aria-label="Меню">⋮</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button class="tab is-active" data-tab="today">
        <span>⌂</span>
        Сегодня
      </button>
      <button class="tab" data-tab="progress">
        <span>▥</span>
        Прогресс
      </button>
      <button class="tab" data-tab="profile">
        <span>◎</span>
        Профиль
      </button>
    </nav>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
